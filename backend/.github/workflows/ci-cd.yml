name: Enterprise KYC Biometric Gateway CI/CD

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Build and Test Microservices
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install Dependencies
        working-directory: backend
        run: go mod download

      - name: Run Unit & Integration Tests
        working-directory: backend
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Compile Gateway Microservice
        working-directory: backend
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/gateway ./cmd/gateway

      - name: Compile Biometric Microservice
        working-directory: backend
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/biometric-service ./cmd/biometric-service

      - name: Compile KYC Microservice
        working-directory: backend
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/kyc-service ./cmd/kyc-service

  docker-build:
    name: Build Docker Images
    needs: test-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Gateway Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/deployments/docker/Dockerfile.gateway
          push: false
          tags: cbe/api-gateway:latest

      - name: Build Biometric Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/deployments/docker/Dockerfile.biometric
          push: false
          tags: cbe/biometric-service:latest

      - name: Build KYC Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/deployments/docker/Dockerfile.kyc
          push: false
          tags: cbe/kyc-service:latest
