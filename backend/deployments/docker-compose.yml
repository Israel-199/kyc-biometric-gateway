version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cbe_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: kyc_biometric_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cbe_redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  kyc-service:
    build:
      context: ../.
      dockerfile: deployments/docker/Dockerfile.kyc
    container_name: cbe_kyc_service
    restart: always
    environment:
      ENV: production
      KYC_PORT: 8082
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: kyc_biometric_db
      WORKER_POOL_SIZE: 100
      WORKER_QUEUE_CAPACITY: 10000
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy

  biometric-service:
    build:
      context: ../.
      dockerfile: deployments/docker/Dockerfile.biometric
    container_name: cbe_biometric_service
    restart: always
    environment:
      ENV: production
      BIOMETRIC_PORT: 8081
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: kyc_biometric_db
      WORKER_POOL_SIZE: 200
      WORKER_QUEUE_CAPACITY: 20000
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    build:
      context: ../.
      dockerfile: deployments/docker/Dockerfile.gateway
    container_name: cbe_api_gateway
    restart: always
    environment:
      ENV: production
      GATEWAY_PORT: 8080
      BIOMETRIC_SERVICE_URL: http://biometric-service:8081
      KYC_SERVICE_URL: http://kyc-service:8082
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: cbe-enterprise-production-secret-key-2026
      RATE_LIMIT_REQUESTS: 5000
      RATE_LIMIT_WINDOW_SEC: 1
      CIRCUIT_BREAKER_THRESH: 5
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      kyc-service:
        condition: service_started
      biometric-service:
        condition: service_started

  prometheus:
    image: prom/prometheus:latest
    container_name: cbe_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

volumes:
  postgres_data:
  redis_data:
